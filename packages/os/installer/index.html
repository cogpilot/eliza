<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="elizaOS Guided Installer - Install elizaOS on your virtual machine or hardware" />
  <meta name="theme-color" content="#050507" />
  
  <title>elizaOS Installer</title>
  
  <!-- Preconnect to font servers -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  
  <!-- Fonts: Poppins for headings, Open Sans for body -->
  <link 
    href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" 
    rel="stylesheet" 
  />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  
  <style>
    /* Critical CSS - prevent flash of unstyled content */
    :root {
      --bg-primary: #050507;
      --text-primary: #E5E7EB;
      --accent: #FF5800;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body, #root {
      width: 100%;
      height: 100%;
    }
    
    body {
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Loading state before React hydrates */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 1.5rem;
    }
    
    .loading-logo {
      width: 80px;
      height: 80px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    .loading-text {
      font-family: 'Poppins', sans-serif;
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--text-primary);
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 88, 0, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Hide loading screen when React is ready */
    #root:not(:empty) .loading-screen {
      display: none;
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- Loading state shown before React hydrates -->
    <div class="loading-screen">
      <svg class="loading-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- elizaOS logo placeholder -->
        <circle cx="50" cy="50" r="45" stroke="#FF5800" stroke-width="2" fill="none" />
        <circle cx="50" cy="50" r="35" stroke="#FF5800" stroke-width="1" fill="none" opacity="0.5" />
        <circle cx="50" cy="50" r="25" stroke="#FF5800" stroke-width="1" fill="none" opacity="0.3" />
        <circle cx="50" cy="50" r="8" fill="#FF5800" />
      </svg>
      <p class="loading-text">elizaOS Installer</p>
      <div class="loading-spinner"></div>
    </div>
  </div>
  
  <!-- Main application script -->
  <script type="module" src="/src/main.tsx"></script>
  
  <!-- Detect if running in installer environment -->
  <script>
    window.ELIZAOS_INSTALLER = {
      isLiveEnvironment: navigator.userAgent.includes('elizaOS-Live'),
      version: '1.0.0',
    };
  </script>
</body>
</html>
