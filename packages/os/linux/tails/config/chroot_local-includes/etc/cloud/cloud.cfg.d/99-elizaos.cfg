# elizaOS Cloud-Init Configuration
# Enables automated provisioning for cloud/VM deployments

# Datasources to try (in order)
datasource_list:
  - NoCloud
  - ConfigDrive
  - OpenStack
  - GCE
  - Azure
  - Ec2
  - None

# System configuration
system_info:
  distro: debian
  default_user:
    name: eliza
    lock_passwd: false
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups:
      - sudo
      - docker
      - audio
      - video
      - plugdev
      - netdev
  paths:
    cloud_dir: /var/lib/cloud
    templates_dir: /etc/cloud/templates
  ssh_svcname: ssh

# Modules to run on first boot
cloud_init_modules:
  - seed_random
  - bootcmd
  - write-files
  - growpart
  - resizefs
  - disk_setup
  - mounts
  - set_hostname
  - update_hostname
  - update_etc_hosts
  - ca-certs
  - rsyslog
  - users-groups
  - ssh

cloud_config_modules:
  - emit_upstart
  - ssh-import-id
  - locale
  - set-passwords
  - grub-dpkg
  - apt-configure
  - ntp
  - timezone
  - disable-ec2-metadata
  - runcmd
  - byobu

cloud_final_modules:
  - package-update-upgrade-install
  - fan
  - landscape
  - lxd
  - puppet
  - chef
  - mcollective
  - salt-minion
  - reset_rmc
  - refresh_rmc_and_interface
  - rightscale_userdata
  - scripts-vendor
  - scripts-per-once
  - scripts-per-boot
  - scripts-per-instance
  - scripts-user
  - ssh-authkey-fingerprints
  - keys-to-console
  - install-hotplug
  - phone-home
  - final-message
  - power-state-change

# Grow partition to fill disk
growpart:
  mode: auto
  devices:
    - /
  ignore_growroot_disabled: false

# Resize filesystem
resize_rootfs: true

# Default user setup
users:
  - default

# Set timezone
timezone: UTC

# SSH configuration
ssh_pwauth: true
ssh_deletekeys: true
ssh_genkeytypes:
  - rsa
  - ed25519

# Package management
apt:
  preserve_sources_list: true

# Disable EC2 metadata (not needed for most VMs)
disable_ec2_metadata: true

# Commands to run after cloud-init
runcmd:
  # Enable elizaOS services
  - systemctl enable elizaos-agent.service
  - systemctl enable elizaos-launcher.service
  - systemctl enable elizaos-first-boot.service
  
  # Start services
  - systemctl start elizaos-first-boot.service || true

# Phone home configuration (disabled by default)
phone_home:
  url: ""
  post: []
  tries: 0

# Final message
final_message: |
  elizaOS cloud-init completed.
  Version: $version
  Timestamp: $timestamp
  Datasource: $datasource
  Uptime: $uptime seconds
